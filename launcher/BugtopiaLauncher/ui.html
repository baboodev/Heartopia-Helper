<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bugtopia</title>
<style>
/* Visual language taken from Vugtopia's launcher: same variables, same card/section/status/banner
   composition, same button set. The web fonts are deliberately not linked — an offline build must
   look the same with no network, so the families fall back to what Windows already has. */
:root {
  --bg-gradient: linear-gradient(135deg, #090d16 0%, #1e1b4b 50%, #090d16 100%);
  --card-bg: rgba(15, 23, 42, 0.75);
  --card-border: rgba(255, 255, 255, 0.08);
  --primary-accent: #6366f1;
  --primary-hover: #4f46e5;
  --secondary-bg: rgba(51, 65, 85, 0.5);
  --secondary-hover: rgba(71, 85, 105, 0.7);
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --success: #10b981;
  --warning: #f59e0b;
  --danger: #ef4444;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
/* The hidden attribute only sets display:none through the UA stylesheet, which any class rule
   outranks - .step sets display:flex, so a hidden card carried on being drawn. */
[hidden] { display: none !important; }

html, body {
  width: 100%; height: 100%; overflow: hidden;
  font-family: 'Inter', 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
  background: #090d16; color: var(--text-main); user-select: none;
}

.app-background {
  position: absolute; inset: 0; z-index: -1;
  background: radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.2) 0%, transparent 50%),
              radial-gradient(circle at 80% 80%, rgba(168, 85, 247, 0.15) 0%, transparent 50%);
}

.launcher-card {
  width: 100%; height: 100%;
  background: var(--card-bg);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  padding: 24px 32px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto;
}
/* Everything in the column keeps its natural height; the log is the only part that gives. Without
   this the banner is handed less room than its text needs and quietly clips. */
.launcher-card > * { flex: none; }
.launcher-card > #log { flex: 1 1 auto; }

/* Three columns so the brand sits in the middle of the window rather than in the space the
   checkbox leaves it. The outer columns match, and only one of them holds anything. */
.launcher-header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; }
/* The logo sits in the left column rather than beside the title in the middle one, so that what
   is centred in the window is the title itself and not the pair of them. */
.brand { display: contents; }
.header-logo {
  grid-column: 1; justify-self: end; margin-right: 16px;
  height: 60px; width: auto; filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.6));
}
.brand-text { grid-column: 2; display: flex; flex-direction: column; align-items: center; gap: 1px; }
.header-controls { grid-column: 3; justify-self: end; display: flex; align-items: center; gap: 14px; }
.brand h1 {
  font-family: 'Outfit', 'Segoe UI Variable Display', 'Segoe UI', sans-serif;
  font-size: 1.9rem; font-weight: 700;
  background: linear-gradient(90deg, #ffffff 0%, #cbd5e1 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.brand .subtitle { font-size: 0.82rem; color: var(--text-muted); }
.brand .subtitle a { color: var(--primary-accent); cursor: pointer; text-decoration: underline; }

/* The two views. Simple is the default; expert is the whole panel, remembered between runs. */
body:not(.expert) .expert-only { display: none !important; }
body.expert .simple-only { display: none !important; }
body:not(.expert) .footer-actions { justify-content: center; }
/* The steps say everything the status line would repeat, so it stays out of the way until it
   has something of its own to report: a failure, or a download in progress. */
body:not(.expert) #log { display: none; }
body:not(.expert) #banner { display: none; }
body:not(.expert) #banner.speak { display: block; }
body:not(.expert) #play { padding: 15px 34px; font-size: 1rem; }

.steps { display: flex; flex-direction: column; gap: 10px; }
.step {
  position: relative; z-index: 0; overflow: hidden;
  display: flex; align-items: center; gap: 14px;
  background: rgba(15, 23, 42, 0.5); border: 1px solid var(--card-border);
  border-radius: 12px; padding: 13px 16px;
}
/* A download fills the card it is for, so what is filling says what is arriving. */
.step::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: var(--progress, 0%);
  background: linear-gradient(90deg, rgba(99, 102, 241, 0.45), rgba(99, 102, 241, 0.18));
  z-index: -1; transition: width 0.12s ease;
}
/* Work with nothing to count - interop generation is minutes of it - sweeps instead of filling, so
   it cannot be mistaken for a bar that finished and never cleared. */
.step.working::before {
  width: 100%; transition: none;
  background: linear-gradient(90deg,
    transparent 0%, rgba(99, 102, 241, 0.10) 35%, rgba(99, 102, 241, 0.40) 50%,
    rgba(99, 102, 241, 0.10) 65%, transparent 100%);
  animation: step-sweep 1.5s linear infinite;
}
@keyframes step-sweep {
  from { transform: translateX(-100%); }
  to   { transform: translateX(100%); }
}
.step-mark { flex: none; width: 22px; height: 22px; }
.step-mark svg { width: 22px; height: 22px; }
.step.done .step-mark { color: var(--success); }
.step.todo .step-mark { color: var(--warning); }
.step.info .step-mark { color: var(--text-muted); }
.step-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.step-title { font-size: 0.9rem; font-weight: 600; }
.step-detail {
  font-size: 0.78rem; line-height: 1.4; color: var(--text-muted);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.step-detail.wrap { white-space: normal; }
.step-detail a { color: var(--primary-accent); cursor: pointer; text-decoration: underline; }
.step-action { flex: none; display: flex; gap: 8px; }
#expert-view { display: flex; flex-direction: column; gap: 14px; }
.section-card { display: flex; flex-direction: column; gap: 6px; }
.input-label { display: block; font-size: 0.82rem; font-weight: 500; color: var(--text-muted); }
.input-hint { margin-top: 0.3rem; font-size: 0.72rem; line-height: 1.35; color: var(--text-muted); opacity: 0.75; }
.input-group { display: flex; gap: 10px; }
.input-group input, .input-group .select-dropdown { flex: 1; min-width: 0; }

input[type=text] {
  background: rgba(15, 23, 42, 0.6); border: 1px solid var(--card-border); border-radius: 10px;
  padding: 10px 14px; color: var(--text-main); font: inherit; font-size: 0.88rem; outline: none;
}
input[type=text]:focus { border-color: var(--primary-accent); }

.select-dropdown {
  width: 100%; border: 1px solid var(--card-border);
  border-radius: 10px; padding: 10px 38px 10px 14px; color: var(--text-main); font: inherit;
  font-size: 0.88rem; outline: none; cursor: pointer;
  /* The native arrow renders hard against the border with no way to space it, so it is replaced by
     the same chevron the rest of the design uses. */
  appearance: none; -webkit-appearance: none;
  background-color: rgba(15, 23, 42, 0.8);
  background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'/%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-position: right 13px center;
  background-size: 14px 14px;
}
.select-dropdown:hover { border-color: var(--secondary-hover); }
.select-dropdown option { background: #0f172a; color: var(--text-main); }

.field-row { display: flex; gap: 12px; }
.field { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }

.status-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.status-box {
  background: rgba(15, 23, 42, 0.5); border: 1px solid var(--card-border);
  border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px;
}
.status-label { font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
.status-value { font-weight: 600; font-size: 0.92rem; }
.status-success { color: var(--success); }
.status-warning { color: var(--warning); }
.status-danger { color: var(--danger); }
.status-unknown { color: var(--text-muted); }

.message-banner {
  position: relative; z-index: 0; overflow: hidden;
  background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 10px; padding: 10px 16px; font-size: 0.85rem; color: var(--text-muted);
}
.message-banner::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: var(--progress, 0%);
  background: linear-gradient(90deg, rgba(99, 102, 241, 0.45), rgba(99, 102, 241, 0.18));
  z-index: -1; transition: width 0.12s ease;
}
.message-banner.warning { color: var(--warning); border-color: rgba(245, 158, 11, 0.35); }

#log {
  flex: 1; min-height: 96px;
  background: rgba(15, 23, 42, 0.6); border: 1px solid var(--card-border); border-radius: 10px;
  padding: 10px 14px; overflow-y: auto; white-space: pre-wrap; user-select: text;
  font-family: 'Cascadia Mono', Consolas, monospace; font-size: 0.74rem; line-height: 1.55;
  color: var(--text-muted);
}

.launcher-footer { display: flex; flex-direction: column; gap: 10px; }
/* Under the button, because that is where someone is looking when they press it - and the key is
   the first thing they will need once the game is up. */
.launch-hint { text-align: center; font-size: 0.75rem; color: var(--text-muted); }
.launch-hint kbd {
  font-family: inherit; font-size: 0.72rem; font-weight: 600; color: var(--text-main);
  background: var(--secondary-bg); border: 1px solid var(--card-border);
  border-radius: 5px; padding: 1px 7px; margin: 0 1px;
}
.footer-actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.launcher-actions { display: flex; gap: 12px; }

.btn {
  font-family: inherit; font-weight: 600; font-size: 0.9rem; padding: 11px 20px;
  border-radius: 10px; border: none; cursor: pointer; transition: all 0.2s ease;
  display: flex; align-items: center; gap: 8px; white-space: nowrap;
}
.btn.compact { padding: 10px 14px; }
.icon-svg { width: 17px; height: 17px; }
.btn.primary {
  background: linear-gradient(135deg, var(--primary-accent) 0%, var(--primary-hover) 100%);
  color: #fff; box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
}
.btn.primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6); }
.btn.secondary { background: var(--secondary-bg); color: var(--text-main); border: 1px solid var(--card-border); }
.btn.secondary:hover:not(:disabled) { background: var(--secondary-hover); }
/* Weighted like the primary rather than tinted like a secondary: it is the button someone reaches
   for in the three seconds they have, so it has to be seen without being read. */
.btn.danger {
  background: linear-gradient(135deg, var(--danger) 0%, #dc2626 100%);
  color: #fff; box-shadow: 0 4px 14px rgba(239, 68, 68, 0.4);
}
.btn.danger:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(239, 68, 68, 0.6); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* Confirmation dialog. A <dialog> rather than an overlay of our own: Escape, focus trapping and
   an inert page come with it, and only one question is ever open at a time. */
.modal {
  border: 1px solid var(--card-border); border-radius: 16px; padding: 0;
  /* The global reset zeroes every margin, including the auto margin a modal <dialog> centres
     itself with, so it has to be put back explicitly. */
  margin: auto;
  background: #0f172a; color: var(--text-main);
  width: min(560px, calc(100vw - 64px));
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
}
.modal::backdrop { background: rgba(9, 13, 22, 0.72); backdrop-filter: blur(3px); }
.modal-body { padding: 24px 26px 20px; display: flex; flex-direction: column; gap: 14px; }
.modal-title { font-size: 1.05rem; font-weight: 700; }
.modal-text {
  font-size: 0.86rem; line-height: 1.55; color: var(--text-muted);
  white-space: pre-wrap; overflow-wrap: anywhere;
  max-height: 46vh; overflow-y: auto;
  user-select: text;   /* the paths are the point - they have to be copyable */
}
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
.modal-input { width: 100%; user-select: text; }
.checkbox-label { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--text-main); cursor: pointer; }
.checkbox-label input { width: 16px; height: 16px; accent-color: var(--primary-accent); cursor: pointer; }
a { color: #a5b4fc; cursor: pointer; text-decoration: none; }
a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="app-background"></div>
<div class="launcher-card">

  <header class="launcher-header">
    <div class="brand">
      <!-- Filled in after load; see PhotinoHost.LoadUi for why it is not inlined here. -->
      <img class="header-logo" id="logo" alt="" hidden />
      <div class="brand-text">
        <h1>Bugtopia Launcher</h1>
        <span class="subtitle" id="version"></span>
      </div>
    </div>
    <div class="header-controls">
      <label class="checkbox-label" title="Show every field and dropdown">
        <input type="checkbox" id="expert" /><span>Expert mode</span>
      </label>
    </div>
  </header>

  <!-- The whole of a first run: what was found, what is still needed, and the button. Each row
       resolves itself, so a machine that is already set up shows four ticks and nothing to do. -->
  <section class="steps simple-only" id="steps">
    <div class="step" id="step-game">
      <span class="step-mark"></span>
      <div class="step-body">
        <span class="step-title">Heartopia</span>
        <span class="step-detail" id="step-game-detail"></span>
      </div>
      <div class="step-action">
        <button class="btn secondary compact" id="step-detect">Detect</button>
        <button class="btn secondary compact" id="step-browse" data-pick="game">Browse...</button>
      </div>
    </div>

    <div class="step" id="step-clean">
      <span class="step-mark"></span>
      <div class="step-body">
        <span class="step-title">Game folder</span>
        <span class="step-detail wrap" id="step-clean-detail"></span>
      </div>
    </div>

    <div class="step" id="step-bepinex">
      <span class="step-mark"></span>
      <div class="step-body">
        <span class="step-title">BepInEx</span>
        <span class="step-detail wrap" id="step-bepinex-detail"></span>
      </div>
      <div class="step-action">
        <button class="btn secondary compact" id="step-archive">Choose the zip...</button>
      </div>
    </div>

    <div class="step" id="step-mod" hidden>
      <span class="step-mark"></span>
      <div class="step-body">
        <span class="step-title">Bugtopia</span>
        <span class="step-detail wrap" id="step-mod-detail"></span>
      </div>
    </div>

    <div class="step" id="step-interop">
      <span class="step-mark"></span>
      <div class="step-body">
        <span class="step-title">Interop assemblies</span>
        <span class="step-detail wrap" id="step-interop-detail"></span>
      </div>
    </div>
  </section>

  <div id="expert-view" class="expert-only">

  <section class="section-card">
    <label class="input-label" for="game">Heartopia Directory</label>
    <div class="input-group">
      <input type="text" id="game" placeholder="Detecting..." readonly />
      <button class="btn secondary" id="detect" title="Search Steam libraries and the usual folders">
        <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        Detect
      </button>
      <button class="btn secondary" data-pick="game">
        <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
        </svg>
        Browse...
      </button>
    </div>
  </section>

  <section class="section-card">
    <label class="input-label" for="source">BepInEx source</label>
    <div class="input-group">
      <input type="text" id="source" placeholder="Folder holding BepInEx\ and dotnet\" readonly />
      <button class="btn secondary compact" id="source-zip">Zip...</button>
      <button class="btn secondary compact" data-pick="source">Folder...</button>
      <button class="btn secondary compact" id="dl-bepinex">Download</button>
    </div>
    <p class="input-hint" id="source-hint"></p>
  </section>

  <section class="section-card">
    <label class="input-label" for="storage">Storage folder</label>
    <div class="input-group">
      <input type="text" id="storage" readonly />
      <button class="btn secondary" data-pick="storage">Browse...</button>
      <button class="btn secondary" id="storage-default">Default</button>
    </div>
  </section>

  <section class="section-card">
    <label class="input-label" for="unityLibsZip">Unity libraries zip</label>
    <div class="input-group">
      <input type="text" id="unityLibsZip" placeholder="optional" readonly />
      <button class="btn secondary" data-pick="unityLibsZip" data-file="1">Browse...</button>
      <button class="btn secondary" id="dl-unitylibs">Download</button>
    </div>
    <p class="input-hint" id="unity-hint"></p>
  </section>

  <section class="section-card">
    <div class="field-row">
      <div class="field">
        <label class="input-label" for="profile">Save Profile</label>
        <div class="input-group">
          <select id="profile" class="select-dropdown"><option value="">No profiles found</option></select>
          <button class="btn secondary compact" id="profile-create" title="Create new profile">
            <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>
        </div>
      </div>
      <div class="field">
        <label class="input-label" for="server">Server</label>
        <div class="input-group">
          <select id="server" class="select-dropdown">
            <option value="8">Global</option>
            <option value="9">SEA</option>
            <option value="10">America</option>
            <option value="12">Asia</option>
            <option value="14">TW / HK / MO</option>
          </select>
        </div>
      </div>
    </div>
    <div class="input-group" id="new-profile-row" style="display:none">
      <input type="text" id="new-profile-name" placeholder="New profile name" autocomplete="off" spellcheck="false" />
      <button class="btn primary compact" id="profile-create-ok">Create</button>
      <button class="btn secondary compact" id="profile-create-cancel">Cancel</button>
    </div>
    <p class="input-hint" id="profile-hint"></p>
  </section>

  <section class="section-card" id="mod-section">
    <label class="input-label" for="mod-version">Bugtopia build</label>
    <div class="input-group">
      <select id="mod-version" class="select-dropdown"><option value="">Newest release</option></select>
      <button class="btn secondary compact" id="mod-load">Load versions</button>
      <button class="btn secondary compact" id="mod-install">Install</button>
    </div>
    <p class="input-hint" id="mod-hint"></p>
  </section>

  <section class="status-grid">
    <div class="status-box">
      <span class="status-label">Game</span>
      <span id="st-game" class="status-value status-unknown">Not set</span>
    </div>
    <div class="status-box">
      <span class="status-label">BepInEx</span>
      <span id="st-payload" class="status-value status-unknown">Not installed</span>
    </div>
    <div class="status-box">
      <span class="status-label">Mod</span>
      <span id="st-mod" class="status-value status-unknown">Not installed</span>
    </div>
    <div class="status-box">
      <span class="status-label">Interop</span>
      <span id="st-interop" class="status-value status-unknown">Missing</span>
    </div>
  </section>
  </div>

  <div class="message-banner" id="banner">Pick your Heartopia directory to begin.</div>

  <div id="log"></div>

  <footer class="launcher-footer">
    <div class="footer-actions">
      <label class="checkbox-label expert-only"><input type="checkbox" id="force" /><span>Force regenerate</span></label>
      <div class="launcher-actions">
        <button class="btn secondary action-btn expert-only" id="prepare">Prepare</button>
        <button class="btn secondary action-btn expert-only" id="generate">Generate interop</button>
        <button class="btn danger action-btn" id="auto-cancel" hidden>Cancel</button>
        <button class="btn primary action-btn" id="play">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"></path>
            <path d="M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"></path>
            <path d="M9 12l-4 4"></path><path d="M15 9l4-4"></path>
          </svg>
          <span id="play-label">Launch Heartopia</span>
        </button>
      </div>
    </div>
    <p class="launch-hint">In game, press <kbd>Insert</kbd> to open the mod menu.</p>
  </footer>
</div>

<dialog class="modal" id="modal">
  <form method="dialog" class="modal-body">
    <h2 class="modal-title" id="modal-title"></h2>
    <div class="modal-text" id="modal-text"></div>
    <input type="text" class="modal-input" id="modal-input" autocomplete="off" spellcheck="false" hidden />
    <div class="modal-actions">
      <!-- Cancel first, so it is what Enter and the initial focus land on. -->
      <button class="btn secondary compact" id="modal-no" value="no" autofocus>Cancel</button>
      <button class="btn primary compact" id="modal-yes" value="yes">Continue</button>
    </div>
  </form>
</dialog>

<script>
let nextId = 1, busy = false, state = {};
const pending = new Map();
const $ = id => document.getElementById(id);

function call(cmd, args) {
  return new Promise((resolve, reject) => {
    const id = "r" + (nextId++);
    pending.set(id, { resolve, reject });
    window.external.sendMessage(JSON.stringify({ id, cmd, args: args || {} }));
  });
}

window.external.receiveMessage(raw => {
  let m; try { m = JSON.parse(raw); } catch { return; }

  if (m.event === "log") { appendLog(m.text); return; }
  if (m.event === "busy") { busy = m.value; if (!busy) { setProgress("", 0); setWorking("", ""); } render(); return; }
  if (m.event === "progress") { setProgress(m.target, m.value); return; }
  if (m.event === "working") { setWorking(m.target, m.text); return; }
  // A state push means the step that was working has finished, so its line goes with it and the
  // card speaks for itself again.
  if (m.event === "state") { setWorking("", ""); state = m.data; render(); return; }
  if (m.event === "confirm") { ask(m); return; }

  const p = pending.get(m.id);
  if (!p) return;
  pending.delete(m.id);
  m.ok ? p.resolve(m.data) : p.reject(new Error(m.error));
});

function appendLog(text) {
  const log = $("log");
  const atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 24;
  log.textContent += (log.textContent ? "\n" : "") + text;
  if (atBottom) log.scrollTop = log.scrollHeight;
}

// Asks, then answers exactly once however the dialog was dismissed - Escape and the close event
// included, since the job on the other side is blocked until something comes back.
function ask(m) {
  const dlg = $("modal");
  const input = $("modal-input");
  $("modal-title").textContent = m.title || "";
  $("modal-text").textContent = m.text || "";
  $("modal-yes").textContent = m.confirmLabel || "Continue";

  const wantsText = m.placeholder !== undefined;
  input.hidden = !wantsText;
  input.value = wantsText ? (m.initial || "") : "";
  input.placeholder = wantsText ? m.placeholder : "";

  dlg.returnValue = "";
  dlg.addEventListener("close", () => {
    call("confirmResult", {
      ticket: m.ticket, ok: dlg.returnValue === "yes", value: input.value.trim()
    });
  }, { once: true });
  dlg.showModal();
  // A question with a field is asking for the field, so start there rather than on Cancel.
  if (wantsText) input.focus();
}

/** Fills one step card, and clears every other, so only one thing is ever seen arriving. */
function setProgress(target, percent) {
  if (target) setWorking("", "");   // a number replaces the sweep

  for (const row of document.querySelectorAll(".step")) {
    const mine = row.id === "step-" + target;
    row.style.setProperty("--progress", mine ? percent + "%" : "0%");
  }

  // Only in expert mode, which has no cards. Filling both at once showed the same bar twice.
  $("banner").style.setProperty("--progress",
    document.body.classList.contains("expert") ? percent + "%" : "0%");
}

/** The card that is working with nothing to count, and what it says while it does. */
let workingTarget = "", workingText = "";

function setWorking(target, text) {
  workingTarget = target || "";
  workingText = text || "";

  for (const row of document.querySelectorAll(".step")) {
    const mine = workingTarget && row.id === "step-" + workingTarget;
    row.classList.toggle("working", !!mine);

    // Every fill is cleared, not only this card's: one thing runs at a time, so a bar left over
    // from the step before would sit there filled under a card that has already finished.
    row.style.setProperty("--progress", "0%");
    if (mine) $(row.id + "-detail").textContent = workingText;
  }
}

function say(text, kind) {
  const b = $("banner");
  b.textContent = text;
  b.classList.toggle("warning", kind === "warning");
  b.classList.toggle("speak", kind === "warning");
}

function mark(el, text, cls) {
  el.textContent = text;
  el.className = "status-value " + cls;
}

const MARKS = {
  done: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>',
  todo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><line x1="12" y1="8" x2="12" y2="13"></line><line x1="12" y1="16.5" x2="12" y2="16.5"></line></svg>',
  info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><line x1="12" y1="11" x2="12" y2="16"></line><line x1="12" y1="7.5" x2="12" y2="7.5"></line></svg>',
};

/** One row of the simple screen: state, what it says, and which of its buttons apply. */
function step(id, state, detail, buttons) {
  const row = $("step-" + id);
  row.className = "step " + state;
  row.querySelector(".step-mark").innerHTML = MARKS[state];
  $("step-" + id + "-detail").innerHTML = detail;
  for (const [name, shown] of Object.entries(buttons || {})) {
    const btn = $("step-" + name);
    btn.style.display = shown ? "" : "none";
    btn.disabled = busy;
  }
}

async function refresh() { state = await call("state"); render(); loadProfiles(); }

/** The header graphic, which the launcher hands over separately from the page. */
async function loadLogo() {
  let src; try { src = await call("logo"); } catch { return; }
  if (!src) return;
  const img = $("logo");
  img.onload = () => { img.hidden = false; };
  img.src = src;
}

// ---- coming into view ------------------------------------------------------
//
// The window starts off-screen and the launcher only puts it up when this fires, so that what
// appears is the finished page. Two frames, not one: the first carries the layout this render just
// queued, the second is the one actually painted.
let revealed = false;
function reveal() {
  if (revealed) return;
  revealed = true;
  requestAnimationFrame(() => requestAnimationFrame(() => call("reveal")));
}

function render() {
  // The notice goes where the version already is. A newer build is not a warning and does not
  // belong in the status line, and it is not something to interrupt anyone over.
  $("version").innerHTML = state.updateVersion
    ? esc(state.version) + '  &middot;  <a data-url="' + esc(state.releasesPage) + '">' +
      esc(state.updateVersion) + " available</a>"
    : esc(state.version || "");
  document.body.classList.toggle("expert", !!state.expert);
  $("expert").checked = !!state.expert;
  renderSteps();

  for (const k of ["game", "source", "storage", "unityLibsZip"]) {
    $(k).value = state[k] || "";
    $(k).title = state[k] || "";   // a long path still outruns its box on a narrow window
  }


  $("source-hint").innerHTML = state.downloads
    ? "The Unity.IL2CPP win-x64 archive — the zip as downloaded, or a folder already unpacked " +
      "from it. Needed only until Prepare."
    : 'The Unity.IL2CPP win-x64 archive — the zip as downloaded, or a folder already unpacked ' +
      'from it. <a data-url="' + state.bepInExUrl + '">Download it here</a>.';

  $("unity-hint").innerHTML = state.unityLibsUrl
    ? (state.downloads
        ? "Optional — BepInEx fetches these itself during the first generation."
        : 'Optional — <a data-url="' + state.unityLibsUrl + '">download ' + state.unityVersion + '.zip</a>.')
    : "Optional. Set the game directory first to resolve the Unity version.";

  for (const b of ["dl-bepinex", "dl-unitylibs"]) $(b).style.display = state.downloads ? "" : "none";

  // Only an online build can install a different one; an offline build has the copy it carries.
  $("mod-section").style.display = state.pluginFromGitHub ? "" : "none";
  renderModVersions();

  // The same words the step cards use, so the two views never disagree about what is installed.
  state.gameOk ? mark($("st-game"), "Found", "status-success")
               : mark($("st-game"), state.game ? "Not an IL2CPP build" : "Not found", "status-warning");
  state.prepared ? mark($("st-payload"), "Installed", "status-success")
                 : mark($("st-payload"), "Not installed", "status-warning");
  state.hasPlugin ? mark($("st-mod"), "Installed", "status-success")
                  : mark($("st-mod"), "Not installed", "status-warning");
  !state.hasInterop ? mark($("st-interop"), "Not built", "status-warning")
    : state.interopStale ? mark($("st-interop"), "Expired", "status-warning")
    : mark($("st-interop"), "Up to date", "status-success");

  // Launch runs every missing step itself, so the button leads and the banner says what that will
  // involve rather than naming another button to press first.
  const ready = state.prepared && state.hasInterop;
  if (!autoTimer) $("play-label").textContent = ready ? "Launch Heartopia" : "Set up and launch";

  const existing = state.existing || {};
  if (existing.found)
    say(existing.root
      ? "An existing install already loads the mod, from " + existing.root +
        ". Launch will ask before moving it here" + (existing.interop ? ", interop assemblies and all." : ".")
      : (existing.melon ? "MelonLoader" : "Another loader") +
        " is installed in the game folder and boots before this launcher can. Launch will ask before removing it.");
  else if (!state.gameOk && !state.game) say("Heartopia was not found automatically — press Detect, or point at it with Browse.");
  else if (!state.gameOk) say("That folder is not an IL2CPP Heartopia build — point at the game with Browse.", "warning");
  else if (!state.prepared && !state.source && !state.downloads)
    say("Point at the BepInEx zip — Launch does everything after that.");
  else if (!ready) say("Nothing else to press: Launch sets the rest up first, which takes several minutes.");
  else say("Ready.");

  keepWorking();
  armAutoLaunch();

  $("prepare").disabled = busy || !state.source;
  $("generate").disabled = busy || !state.prepared || !state.gameOk;
  $("play").disabled = busy;
  $("dl-bepinex").disabled = busy;
  $("source-zip").disabled = busy;
  $("dl-unitylibs").disabled = busy || !state.gameOk;

  reveal();
}

// ---- starting on its own ---------------------------------------------------
//
// Nothing left to do means nothing left to press, so after three seconds it presses the button
// itself. Armed once per run whatever the outcome: a countdown that comes back after being told no
// is worse than no countdown.

let autoTimer = null, autoLeft = 0, autoArmed = false;

/** Every card that is showing is green - which is literally what the user sees. */
function everythingGreen() {
  const rows = [...document.querySelectorAll(".step")].filter(r => !r.hidden);
  return rows.length > 0 && rows.every(r => r.classList.contains("done"));
}

function armAutoLaunch() {
  // Not in expert mode: someone with every field open is configuring, not waiting to play.
  if (autoArmed || autoTimer || busy || state.expert || !everythingGreen()) return;

  autoArmed = true;
  autoLeft = 3;
  $("auto-cancel").hidden = false;
  showCountdown();
  autoTimer = setInterval(() => {
    autoLeft -= 1;
    if (autoLeft > 0) { showCountdown(); return; }
    stopAutoLaunch();
    run("play");
  }, 1000);
}

function showCountdown() {
  $("play-label").textContent = "Launching in " + autoLeft + "\u2026";
}

function stopAutoLaunch() {
  if (autoTimer) clearInterval(autoTimer);
  autoTimer = null;
  $("auto-cancel").hidden = true;
  $("play-label").textContent = "Launch Heartopia";
}

$("auto-cancel").onclick = () => stopAutoLaunch();

// Any key stops it, not only Escape: the reflex when a countdown appears is to hit something.
document.addEventListener("keydown", () => { if (autoTimer) stopAutoLaunch(); });

/** The simple screen. Everything here is derived from the same state the expert panel shows. */
function renderSteps() {
  const existing = state.existing || {};

  step("game", state.gameOk ? "done" : "todo",
       state.gameOk ? "Found" : state.game ? "Not an IL2CPP build" : "Not found",
       { detect: !state.gameOk, browse: !state.gameOk });

  if (!state.gameOk) {
    // Nothing to be clean about yet: this card is an opinion about a folder, and there is no folder.
    step("clean", "info", "Checked once the game is found.", {});
  } else if (existing.found) {
    step("clean", "info", existing.root
      ? "An existing install at " + esc(existing.root) +
        " loads the mod. Launch will ask before moving it here" +
        (existing.interop ? ", interop assemblies and all." : ".")
      : (existing.melon ? "MelonLoader" : "Another loader") +
        " is installed here and boots first. Launch will ask before removing it.",
      {});
  } else {
    step("clean", "done", "Clean - nothing else loads into this game.", {});
  }

  const haveSource = !!state.source || state.prepared;
  step("bepinex", state.prepared ? "done" : haveSource || state.downloads ? "info" : "todo",
       state.prepared ? "Installed"
       : haveSource ? "Not installed - Launch installs the archive you chose."
       : state.downloads ? "Not installed - Launch downloads it."
       : 'Not installed. <a data-url="' + esc(state.bepInExUrl) + '">Download the archive</a>, ' +
         'then choose the zip.',
       { archive: !state.prepared && !state.downloads });

  // Only an online build has anything to say here: an offline one installs the copy it carries.
  $("step-mod").hidden = !state.pluginFromGitHub;
  if (state.pluginFromGitHub) {
    step("mod", state.hasPlugin ? "done" : "info",
         !state.hasPlugin ? "Not installed - Launch downloads it."
         : state.modUpdate ? "Installed - Launch updates it to " + esc(state.modUpdate) + "."
         : "Installed",
         {});
  }

  step("interop", !state.hasInterop ? "info" : state.interopStale ? "todo" : "done",
       !state.hasInterop ? "Not built - Launch builds them, which takes several minutes, once."
       : state.interopStale ? "Expired - the game has changed since; Launch rebuilds them."
       : "Up to date",
       {});
}

// Re-applied after every render: a state push mid-job rebuilds every card from the state, which
// knows nothing about the step running right now.
function keepWorking() {
  if (workingTarget) setWorking(workingTarget, workingText);
}

function esc(text) {
  return String(text == null ? "" : text)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

/** The release dropdown. Filled only once someone asks for it - the API counts requests. */
function renderModVersions() {
  const select = $("mod-version");
  const releases = state.modReleases || [];
  const chosen = select.value;

  select.innerHTML = '<option value="">Newest release</option>';
  for (const release of releases) {
    const option = document.createElement("option");
    option.value = release.tag;
    option.textContent = release.tag + "  (" + release.asset + ")";
    select.appendChild(option);
  }
  select.value = chosen;

  $("mod-hint").textContent = !state.pluginVersion
    ? (releases.length ? "" : "Nothing installed yet.")
    : "Installed: " + state.pluginVersion +
      (state.pinnedMod === state.pluginVersion ? " (pinned - launches will not move past it)"
       : state.modUpdate ? " - Launch updates it to " + state.modUpdate
       : "") +
      (releases.length ? "" : " - press Load versions to pick another.");

  for (const b of ["mod-version", "mod-load", "mod-install"]) $(b).disabled = busy;
}

async function loadProfiles() {
  let info; try { info = await call("profiles"); } catch { return; }

  const select = $("profile");
  select.innerHTML = "";
  if (!info.profiles.length) select.innerHTML = '<option value="">No profiles found</option>';
  for (const name of info.profiles) {
    const o = document.createElement("option");
    o.value = name;
    o.textContent = name;
    if (name === info.active) o.selected = true;
    select.appendChild(o);
  }

  $("profile-hint").textContent = info.available
    ? (info.active ? "" : "No active profile yet.")
    : "The game has not created its save folder yet.";
  for (const b of ["profile", "server", "profile-create"]) $(b).disabled = !info.available;

  if (info.active) {
    const value = await call("serverGet", { profile: info.active });
    if (value > 0) $("server").value = String(value);
  }
}

function run(cmd, args) {
  return call(cmd, args)
    .then(s => { if (s && s.storage !== undefined) { state = s; render(); } })
    .catch(e => { appendLog("• " + e.message); say(e.message, "warning"); });
}

document.addEventListener("click", async e => {
  const url = e.target.getAttribute && e.target.getAttribute("data-url");
  if (url) { call("openUrl", { url }); return; }

  const btn = e.target.closest && e.target.closest("[data-pick]");
  if (btn) {
    const key = btn.getAttribute("data-pick");
    const chosen = btn.hasAttribute("data-file")
      ? await call("pickFile", { title: "Unity base libraries zip" })
      : await call("pickFolder", { title: "Select folder", current: $(key).value });
    if (chosen) { $(key).value = chosen; save(); }
  }
});

function save() {
  return call("setPaths", {
    game: $("game").value, source: $("source").value,
    storage: $("storage").value, unityLibsZip: $("unityLibsZip").value
  }).then(s => { state = s; render(); });
}

$("expert").onchange = () => {
  stopAutoLaunch();
  run("setExpert", { value: $("expert").checked });
};

$("step-detect").onclick = () => $("detect").onclick();

// Both views take the zip the same way: it is unpacked into storage and the source path becomes
// the folder that came out of it, which is what the expert field then shows. Picking a folder
// stays available beside it - an install kept unpacked somewhere else is a supported setup.
async function chooseArchive() {
  const chosen = await call("pickFile", { title: "BepInEx-Unity.IL2CPP-win-x64 archive" });
  if (chosen) run("useArchive", { path: chosen });
}
$("step-archive").onclick = chooseArchive;
$("source-zip").onclick = chooseArchive;

$("detect").onclick = async () => {
  const found = await call("detectGame");
  if (found) { $("game").value = found; await save(); }
  else say("No Heartopia install found. Point at it with Browse.", "warning");
};

$("mod-load").onclick = () => run("modReleases");
$("mod-install").onclick = () => run("installMod", { tag: $("mod-version").value });

$("storage-default").onclick = () => { $("storage").value = state.defaultStorage; save(); };
$("prepare").onclick = () => run("prepare");
$("generate").onclick = () => run("generateInterop", { force: $("force").checked });
$("play").onclick = () => { stopAutoLaunch(); run("play"); };
$("dl-bepinex").onclick = () => run("downloadBepInEx");
$("dl-unitylibs").onclick = () => run("downloadUnityLibs");

$("profile-create").onclick = () => {
  $("new-profile-row").style.display = "flex";
  $("new-profile-name").focus();
};
$("profile-create-cancel").onclick = () => {
  $("new-profile-row").style.display = "none";
  $("new-profile-name").value = "";
};
$("profile-create-ok").onclick = async () => {
  const name = $("new-profile-name").value.trim();
  if (!name) return;
  await call("profileCreate", { name }).catch(e => { appendLog("• " + e.message); say(e.message, "warning"); });
  $("profile-create-cancel").onclick();
  loadProfiles();
};

// Both dropdowns take effect the moment they change, so a failure cannot be left showing on
// screen as if it had worked: loadProfiles puts them back to what is actually on disk.
$("profile").onchange = async () => {
  const name = $("profile").value;
  if (!name) return;
  await call("profileSwitch", { name }).catch(e => { appendLog("• " + e.message); say(e.message, "warning"); });
  loadProfiles();
};

$("server").onchange = async () => {
  await call("serverSet", { profile: $("profile").value || "", value: parseInt($("server").value, 10) })
    .catch(e => { appendLog("• " + e.message); say(e.message, "warning"); loadProfiles(); });
};

// The logo is asked for first so its answer comes back first: replies are written in the order the
// requests arrive, and a logo that lands after the first render would appear after the window does.
loadLogo();
refresh();
</script>
</body>
</html>
